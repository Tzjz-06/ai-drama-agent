[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-drama-agent"
version = "0.4.3"
description = "饺子短剧：AI 剧本、资产和分镜提示词创作工作台"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "pypdf>=6.0",
  "PyMuPDF>=1.24",
  "paddleocr>=3.0",
  "paddlepaddle>=3.0",
  "python-docx>=1.1",
]

[project.scripts]
ai-drama-agent = "ai_drama_agent.cli:main"
ai-drama-desktop = "ai_drama_agent.desktop:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
