services:
  redis:
    image: redis:7.4-alpine
    container_name: jiaozi-drama-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - jiaozi-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  queue-gateway:
    build:
      context: ./worker
    container_name: jiaozi-drama-queue-gateway
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      AI_DRAMA_REDIS_ADDR: redis:6379
      AI_DRAMA_WORKER_MODE: gateway
      AI_DRAMA_GATEWAY_ADDR: :8787
    ports:
      - "${TASK_GATEWAY_PORT:-8787}:8787"

  worker:
    build:
      context: ./worker
    container_name: jiaozi-drama-worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      AI_DRAMA_REDIS_ADDR: redis:6379
      AI_DRAMA_WORKER_MODE: worker
      AI_DRAMA_IMAGE_API_URL: ${AI_DRAMA_IMAGE_API_URL:-}
      AI_DRAMA_IMAGE_API_KEY: ${AI_DRAMA_IMAGE_API_KEY:-}
      AI_DRAMA_VIDEO_API_URL: ${AI_DRAMA_VIDEO_API_URL:-}
      AI_DRAMA_VIDEO_API_KEY: ${AI_DRAMA_VIDEO_API_KEY:-}
      FFMPEG_BIN: ffmpeg
    volumes:
      - jiaozi-output:/data/outputs

volumes:
  jiaozi-redis:
  jiaozi-output:
